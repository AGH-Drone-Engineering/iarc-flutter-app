name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create/update Releases

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Build both AAB and per-ABI APKs
      - run: flutter build appbundle --release
      - run: flutter build apk --release --split-per-abi

      # optional: show where the files landed if debugging paths
      - run: ls -R build/app/outputs || true

      # Create (or update) the Release for this tag and upload assets
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/apk/release/*.apk
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          generate_release_notes: true
