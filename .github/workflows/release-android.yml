name: Android Release

on:
  push:
    tags:
      - "v*"
  # Manual trigger. Doubles as the fastest way to tell "Actions is off" apart
  # from "the tag push did not fire": if the Run workflow button is missing,
  # Actions is disabled for the repo or the org, not misconfigured here.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build (defaults to the selected branch)"
        required: false

permissions:
  contents: write   # required to create/update Releases

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Build both AAB and per-ABI APKs (armeabi-v7a + arm64-v8a only)
      - run: flutter build appbundle --release
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      # optional: show where the files landed if debugging paths
      - run: ls -R build/app/outputs || true

      - name: Collect and rename release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/iarc-app-${VERSION}.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/iarc-app-x32-${VERSION}.apk"
          mv build/app/outputs/bundle/release/app-release.aab "dist/iarc-app-${VERSION}.aab"
          ls -l dist

      # Create (or update) the Release for this tag and upload assets
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true

