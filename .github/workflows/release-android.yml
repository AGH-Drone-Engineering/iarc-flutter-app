name: Android Release

on:
  push:
    tags:
      - "v*"
  # Manual trigger, for when a tag push does not fire. Pick the tag itself in
  # the "Use workflow from" selector, not a branch: the upload step below is
  # gated on refs/tags/*, so a run started from a branch builds but publishes
  # nothing.
  workflow_dispatch:

permissions:
  contents: write   # required to create/update Releases

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Reconstruct the release signing key from secrets. Without this the
      # Flutter template falls back to the debug key, and a runner generates a
      # fresh debug key per run - so every build would be signed by a different
      # identity and none could be installed over another.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set - refusing to ship a debug-signed release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=../upload-keystore.jks
          EOF

      # Build both AAB and per-ABI APKs (armeabi-v7a + arm64-v8a only)
      - run: flutter build appbundle --release
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      # optional: show where the files landed if debugging paths
      - run: ls -R build/app/outputs || true

      - name: Collect and rename release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/iarc-app-${VERSION}.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/iarc-app-x32-${VERSION}.apk"
          mv build/app/outputs/bundle/release/app-release.aab "dist/iarc-app-${VERSION}.aab"
          ls -l dist

      # Create (or update) the Release for this tag and upload assets
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true

