name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to create a Release

jobs:
  build-android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Pull version from the tag: vX.Y.Z(+BUILD)?
      - name: Derive VERSION_NAME and BUILD_NUMBER from tag
        id: ver
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "VERSION_NAME=${BASH_REMATCH[1]}" >> $GITHUB_ENV
            echo "BUILD_NUMBER=${BASH_REMATCH[2]}" >> $GITHUB_ENV
          elif [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "VERSION_NAME=${BASH_REMATCH[1]}" >> $GITHUB_ENV
            echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          else
            echo "VERSION_NAME=1.0.0" >> $GITHUB_ENV
            echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          fi
          echo "Building $VERSION_NAME+$BUILD_NUMBER"

      # Decode keystore from repo secrets → android/app/upload-keystore.jks
      - name: Decode keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # Build signed release AAB + split APKs with version from the tag
      - name: Build release appbundle (AAB)
        run: flutter build appbundle --release --build-name $VERSION_NAME --build-number $BUILD_NUMBER

      - name: Build release APKs (per ABI)
        run: flutter build apk --release --split-per-abi --build-name $VERSION_NAME --build-number $BUILD_NUMBER

      # Upload artifacts to the workflow run
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.VERSION_NAME }}+${{ env.BUILD_NUMBER }}
          path: |
            build/app/outputs/bundle/release/app.aab
            build/app/outputs/apk/release/*.apk

      # Create/Update the GitHub Release for this tag and attach assets
      - name: Create GitHub Release and attach files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app.aab
            build/app/outputs/apk/release/*.apk
          generate_release_notes: true
